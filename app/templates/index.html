<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Historias Interactivas con Música</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container">

       <p> <img src="{{ url_for('static', filename='logo.png') }}"
            alt="Logo" 
            class="logo"
            width="1200" 
            height="auto">
       </p><br>
<!--        <h1>Generador Interactivo de Historias<br> 
            con Musica</h1> -->
        
        <div class="input-group">
            <input type="text" id="prompt" placeholder="Ej: Un dragón que aprende a programar en Python">
            <button class="btn-generar" onclick="generarHistoria('inicio')">
                Generar Historia
            </button>
        </div>
        
        <div id="contenido" style="display: none;">
            <div id="imagen-container">
                <img id="imagen" alt="Imagen generada por IA">
            </div>
            
            <div id="historia-container">
                <h2><center>Tu Historia:</center></h2>
                <p id="historia"></p>
            </div>
            
            <div id="opciones-container">
                <h3><center>¿Qué quieres hacer ahora?</center></h3>
                <div id="opciones"></div>
                
                <!-- Nuevos controles de audio integrados -->
                <div id="music-controls" class="centered-controls">
                    <button onclick="player.toggleMute()" id="mute-btn">🔊</button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.4">
                    <span id="current-genre">🎵 Sin música</span>
                </div>
            </div>
        </div>
    </div>

    


    <script>
        // Sistema de reproducción musical mejorado
        class MusicPlayer {
            constructor() {
                this.audio = new Audio();
                this.audio.loop = true;
                this.volume = 0.4;
                this.isMuted = false;
                this.currentGenre = null;
            }
            
            async play(genero) {
                if (this.currentGenre === genero) return;
                
                this.currentGenre = genero;
                document.getElementById('current-genre').textContent = `🎵 ${this.capitalizeFirstLetter(genero)}`;
                
                try {
                    this.audio.src = `/static/sounds/${genero}.mp3`;
                    this.audio.volume = this.isMuted ? 0 : this.volume;
                    await this.audio.play();
                } catch (e) {
                    console.log("Error de audio:", e);
                }
            }
            
            setVolume(vol) {
                this.volume = vol;
                if (!this.isMuted) {
                    this.audio.volume = vol;
                }
            }
            
            toggleMute() {
                this.isMuted = !this.isMuted;
                this.audio.volume = this.isMuted ? 0 : this.volume;
                document.getElementById('mute-btn').textContent = this.isMuted ? "🔇" : "🔊";
            }
            
            capitalizeFirstLetter(string) {
                return string.charAt(0).toUpperCase() + string.slice(1);
            }
        }

        const player = new MusicPlayer();
        let historiaActual = "";
        let imagenActual = "";

        // Configurar controles de volumen
        document.getElementById('volume-slider').addEventListener('input', (e) => {
            player.setVolume(parseFloat(e.target.value));
        });

        // Función para detectar género con IA
        async function detectarGenero(historia) {
            try {
                const response = await axios.post('/detectar_genero', { historia });
                return response.data.genero || "aventura";
            } catch (error) {
                console.error("Error detectando género:", error);
                return "aventura"; // Género por defecto
            }
        }

        // Función principal mejorada
        async function generarHistoria(accion) {
            mostrarCargando();
            const prompt = accion === "inicio" 
                ? document.getElementById('prompt').value 
                : historiaActual;
            
            if (!prompt && accion === "inicio") {
                alert("Por favor escribe un tema para tu historia");
                ocultarCargando();
                return;
            }
            
            try {
                const response = await axios.post('/generar_historia', {
                    prompt: accion === "inicio" ? prompt : "",
                    accion: accion,
                    historia_actual: historiaActual
                });
                
                historiaActual = response.data.historia;
                imagenActual = response.data.imagen;
                
                // Mostrar resultados
                document.getElementById('historia').innerText = historiaActual;
                const imgElement = document.getElementById('imagen');
                imgElement.src = imagenActual;
                imgElement.style.display = 'block';
                
                // Configurar opciones
                const opcionesDiv = document.getElementById('opciones');
                opcionesDiv.innerHTML = '';
                
                response.data.opciones.forEach(opcion => {
                    const btn = document.createElement('button');
                    btn.className = 'opcion-btn';
                    btn.innerText = opcion;
                    
                    btn.onclick = () => {
                        const accionMap = {
                            "Continuar la historia": "continuar",
                            "Cambiar el escenario": "escenario",
                            "Hacer un giro inesperado": "giro"
                        };
                        generarHistoria(accionMap[opcion]);
                    };
                    
                    opcionesDiv.appendChild(btn);
                });
                
                // Reproducir música adecuada
                const genero = await detectarGenero(historiaActual);
                player.play(genero);
                
                // Mostrar contenido
                mostrarElemento('contenido');
                if(accion === "inicio") {
                    document.getElementById('prompt').value = "";
                    window.scrollTo({
                        top: document.getElementById('contenido').offsetTop,
                        behavior: 'smooth'
                    });
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Ocurrió un error. Por favor intenta nuevamente.");
            } finally {
                ocultarCargando();
            }
        }

        // Funciones auxiliares
        function mostrarElemento(id) {
            document.getElementById(id).style.display = 'block';
        }
        
        function mostrarCargando() {
            const btn = document.querySelector('.btn-generar');
            btn.innerHTML = '<span class="spinner"></span> Generando...';
            btn.disabled = true;
        }
        
        function ocultarCargando() {
            const btn = document.querySelector('.btn-generar');
            btn.textContent = 'Generar Historia';
            btn.disabled = false;
        }

        // Ejemplo de música al cargar (opcional)
        window.addEventListener('load', () => {
            player.setVolume(0.4); // Volumen inicial al 40%
        });
    </script>
</body>
<br>
<br>
<footer><center><p>
    Generador de Historias Interactivas<br>
    Desarrollado por &copy;Jesus Diaz
</p></center></footer>

</html>
